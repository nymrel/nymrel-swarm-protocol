name: Release & Publish (npm + PyPI)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-node:
    name: Test Node.js (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
        continue-on-error: true

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build bundle
        run: npm run build

      - name: Run Node.js test suite
        run: npm test

  test-python:
    name: Test Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
        continue-on-error: true

      - name: Install dependencies & build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest
          pip install -e . || pip install . || true

      - name: Run Python unit tests
        env:
          PYTHONPATH: ./:./python:./src
        run: python -m unittest discover -s tests -p 'test_*.py'

  security-audit:
    name: Security & DevSecOps Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: NPM Security Audit
        run: |
          npm audit --audit-level=high || echo "::warning ::NPM audit reported potential high-severity advisories"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit & Pip-Audit
        run: pip install --upgrade bandit pip-audit

      - name: Bandit SAST Security Scan
        run: |
          bandit -r . -x ./node_modules,./dist,./.git,./test,./tests,./python/tests,./tests/python -ll -ii || echo "::warning ::Bandit flagged potential security issues"

      - name: Pip-Audit Dependency Vulnerability Scan
        run: |
          pip-audit || echo "::warning ::Pip-audit check completed"

  publish-npm:
    name: Publish to npm (OIDC Provenance)
    needs: [test-node, test-python, security-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prepublish validation (build & test)
        run: npm run prepublishOnly

      - name: Publish package to npm with OIDC provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  publish-pypi:
    name: Publish to PyPI (OIDC Trusted Publishing)
    needs: [test-node, test-python, security-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/nymrel-swarm-protocol

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packaging tools & twine
        run: pip install --upgrade pip build twine

      - name: Build source distribution and binary wheel
        run: python -m build

      - name: Validate distribution integrity
        run: twine check dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
