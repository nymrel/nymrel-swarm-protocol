name: CI and Trusted Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-protocol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-node:
    name: Node.js ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node-version: 18.x }
          - { os: ubuntu-24.04, node-version: 20.x }
          - { os: ubuntu-24.04, node-version: 22.x }
          - { os: ubuntu-24.04, node-version: 24.x }
          - { os: windows-2025, node-version: 18.x }
          - { os: windows-2025, node-version: 24.x }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build and test
        run: npm run test:ts

      - name: Verify generated distribution is current
        run: git diff --exit-code -- dist

  test-python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python-version: '3.9' }
          - { os: ubuntu-24.04, python-version: '3.12' }
          - { os: ubuntu-24.04, python-version: '3.14' }
          - { os: windows-2025, python-version: '3.9' }
          - { os: windows-2025, python-version: '3.14' }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned packaging tools
        run: >-
          python -m pip install --disable-pip-version-check
          build==1.6.0 twine==7.0.0

      - name: Build and validate the distributions
        run: |
          python -m build --outdir python-dist
          python -m twine check python-dist/*

      - name: Install the built wheel
        run: >-
          python -c "import pathlib, subprocess, sys;
          wheel = next(pathlib.Path('python-dist').glob('*.whl'));
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--disable-pip-version-check', '--force-reinstall', '--no-deps', str(wheel)])"

      - name: Validate the installed package and test
        run: |
          python -m pip check
          python -m unittest discover -s tests -p 'test_*.py'
          swarm-protocol-py --help

  security:
    name: Dependency and source security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the release Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up the trusted-publishing npm CLI
        run: npm install --global npm@11.19.1

      - name: Audit locked Node.js dependencies
        run: |
          npm ci --strict-allow-scripts
          npm audit --audit-level=high

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned Python security tools
        run: >-
          python -m pip install --disable-pip-version-check
          bandit==1.9.4 pip-audit==2.10.1

      - name: Scan Python source
        run: bandit -r python -ll -ii

      - name: Audit the local Python project
        run: pip-audit --strict .

  build-release:
    name: Build verified release artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test-node, test-python, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the release Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up the trusted-publishing npm CLI
        run: npm install --global npm@11.19.1

      - name: Verify, build, and pack the npm distribution
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          npm ci --strict-allow-scripts
          npm run release:verify -- --tag "${GITHUB_REF_NAME}"
          npm run prepublishOnly
          mkdir -p release/npm
          npm pack --pack-destination release/npm
          mapfile -t packages < <(find release/npm -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#packages[@]}" -eq 1
          if tar -tzf "${packages[0]}" | grep -Eq '(__pycache__/|\.pyc$|\.egg-info/)'; then
            echo "::error::npm distribution contains generated Python metadata"
            exit 1
          fi
          consumer="${RUNNER_TEMP}/npm-consumer"
          npm install --ignore-scripts --prefix "${consumer}" "${packages[0]}"
          NODE_PATH="${consumer}/node_modules" node -e "const api = require('@nymrel/swarm-protocol'); if (typeof api.ClaimManager !== 'function' || typeof api.TwoSeatProtocol !== 'function') process.exit(1)"
          "${consumer}/node_modules/.bin/swarm-protocol" --help

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Build and validate the Python distributions
        run: |
          python -m pip install --disable-pip-version-check build==1.6.0 twine==7.0.0
          python -m build --outdir release/python-dist
          python -m twine check release/python-dist/*
          python -m pip install --disable-pip-version-check --force-reinstall --no-deps release/python-dist/*.whl
          python -m unittest discover -s tests -p 'test_*.py'
          swarm-protocol-py --help

      - name: Upload the immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish npm with trusted publishing
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions-${{ github.sha }}
          path: release

      - name: Set up the trusted-publishing Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          registry-url: https://registry.npmjs.org

      - name: Set up the trusted-publishing npm CLI
        run: npm install --global npm@11.19.1

      - name: Publish exactly one npm distribution
        shell: bash
        run: |
          mapfile -t packages < <(find release/npm -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --access public

  publish-pypi:
    name: Publish PyPI with trusted publishing
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/nymrel-swarm-protocol
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions-${{ github.sha }}
          path: release

      - name: Publish the Python distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/python-dist
          verbose: true
