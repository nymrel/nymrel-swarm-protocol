[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nymrel-swarm-protocol"
version = "1.0.0"
description = "Zero-dependency Multi-Agent Swarm Protocol, Two-Seat Command Studio Contract, and File-Based Bus Engine."
readme = "README.md"
authors = [
    { name = "Nymrel / JalenBuilds LLC", email = "contact@nymrel.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing"
]
keywords = [
    "multi-agent",
    "swarm-protocol",
    "agent-coordination",
    "two-seat-command",
    "fencing-token",
    "distributed-systems",
    "file-bus",
    "claims-leases"
]
dependencies = []

[project.scripts]
swarm-protocol-py = "nymrel_swarm_protocol.cli:main"

[project.urls]
Homepage = "https://nymrel.com/swarm-protocol"
Documentation = "https://nymrel.com/swarm-protocol/docs"
Repository = "https://github.com/nymrel/nymrel-swarm-protocol"
Issues = "https://github.com/nymrel/nymrel-swarm-protocol/issues"
